name: referenced-chatgpt-conversation-this-is-an

services:
  postgres:
    image: postgres:17-alpine
    container_name: brain-booster-lab-postgres
    environment:
      POSTGRES_DB: brain_booster_lab
      POSTGRES_USER: brain_booster
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brain_booster_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brain_booster -d brain_booster_lab"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:

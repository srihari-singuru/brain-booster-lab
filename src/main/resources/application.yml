spring:
  application:
    name: brain-booster-lab
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/brain_booster_lab}
    username: ${DATABASE_USER:brain_booster}
    password: ${DATABASE_PASSWORD:brain_booster_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

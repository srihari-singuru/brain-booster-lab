server:
  address: 127.0.0.1
  error:
    # All deliberate workflow rejections carry a short, safe recovery message.
    include-message: always

spring:
  application:
    name: brain-booster-lab
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/brain_booster_lab}
    username: ${DATABASE_USER:brain_booster}
    password: ${DATABASE_PASSWORD:brain_booster_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

brain-booster:
  generation:
    mode: ${GENERATION_MODE:mock}
    model: ${OPENAI_MODEL:}
  artwork:
    mode: ${ARTWORK_MODE:mock}
    model: ${OPENAI_IMAGE_MODEL:}
  narration:
    # Blank values inherit the text-generation mode and model above.
    mode: ${NARRATION_MODE:}
    model: ${NARRATION_MODEL:}
  speech:
    # Blank mode inherits GENERATION_MODE. The default is the expressive OpenAI Speech API model.
    mode: ${SPEECH_MODE:}
    model: ${OPENAI_TTS_MODEL:gpt-4o-mini-tts}
    voice: ${OPENAI_TTS_VOICE:cedar}
  render:
    ffmpeg-path: ${FFMPEG_PATH:ffmpeg}
    output-dir: ${RENDER_OUTPUT_DIR:outputs/rendered}

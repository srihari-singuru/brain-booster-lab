<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Brain Booster Lab</title>
  <link rel="stylesheet" href="/studio.css">
  <script src="/studio.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">BRAIN BOOSTER LAB</a>
    <a class="history-link" href="/history.html">Previous history</a>
  </header>
  <main class="home">
    <section id="workspace" aria-label="Episode workspace">
      <h1>Make the next puzzle video.</h1>
      <p class="intro">A calm, manual studio for original family puzzle videos.</p>
    </section>
    <form id="brief-form" class="create-form">
        <label>CHANNEL NAME<input id="channel-name" required maxlength="48" value="BRAIN BOOSTER LAB"></label>
        <label>NUMBER OF PUZZLES<input id="puzzle-count" type="number" min="1" max="10" step="1" value="3" required></label>
        <label>CREATIVE PROMPT<textarea id="brief" required maxlength="4000" rows="8">Create fresh, picture-first family puzzle challenges for ages 6–18 to solve with parents. Make every puzzle feel new: rotate settings, subjects, story situations, visual clue types, and answer patterns. Use three to five equally plausible A–E choices only when the scene needs them. Aim for fair medium difficulty: a child can solve it by carefully looking, but the proof should feel satisfying. Include friendly monsters, ghosts, animals, people, or imaginative worlds when useful, without repeating familiar robot, cardboard, winding-key, or ghost patterns. Avoid arithmetic, tiny details, long rules, and repeated puzzle structures. Use vibrant, polished illustrations and warm, exciting storytelling.</textarea></label>
        <p class="home-assurance">You choose every action. Results stay available after refresh.</p>
        <details class="advanced"><summary>Production profile</summary><div class="setting-grid">
          <label>TEXT MODEL<select id="text-model" required></select></label>
          <label>IMAGE MODEL<select id="image-model" required></select></label>
          <label>NARRATION MODEL<select id="narration-model" required></select></label>
          <label>SPEECH MODEL<select id="speech-model" required></select></label>
          <label>VOICE<select id="speech-voice"><option>cedar</option><option>marin</option><option>alloy</option><option>ash</option><option>ballad</option><option>coral</option><option>echo</option><option>fable</option><option>nova</option><option>onyx</option><option>sage</option><option>shimmer</option><option>verse</option></select></label>
          <label>VOICE SPEED<select id="speech-speed"><option value="0.85">0.85×</option><option value="0.90">0.90×</option><option value="0.95">0.95×</option><option value="1" selected>1.00×</option><option value="1.05">1.05×</option><option value="1.10">1.10×</option></select></label>
        </div><p class="privacy-note">Your API key stays in your local <code>.env</code>.</p></details>
        <button type="submit" class="primary wide">Create episode</button>
    </form>
  </main>
  <div id="notice" role="status" aria-live="polite" hidden></div>
</body>
</html>

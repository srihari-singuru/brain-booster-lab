<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Puzzle Pop</title>
  <link rel="stylesheet" href="/studio.css">
  <script src="/studio.js?v=artwork-selection-failures-2" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">PUZZLE POP</a>
    <a class="history-link" href="/history.html">Previous history</a>
  </header>
  <main class="home">
    <section id="workspace" aria-label="Episode workspace">
      <h1>Make the next puzzle video.</h1>
      <p class="intro">A calm, manual studio for original family puzzle videos.</p>
    </section>
    <form id="brief-form" class="create-form">
        <label>CHANNEL NAME<input id="channel-name" required maxlength="48" value="PUZZLE POP"></label>
        <label>NUMBER OF PUZZLES<input id="puzzle-count" type="number" min="1" max="20" step="1" value="3" required></label>
        <label>CREATIVE PROMPT<textarea id="brief" required maxlength="4000" rows="8">Create fresh, viral family detective cases for children, teens, and parents. Each case opens with a one-sentence hook (something funny or surprising just happened), has three or four believable suspects standing in one bright illustrated scene, and asks one direct question such as who did it, who is lying, or who is fake. Viewers get ten seconds to study the picture. Hide one fair, decisive visual clue that links the scene to the culprit, and give every innocent suspect a tempting red herring that the clue rules out. Make the cases medium-hard: the answer should need two linked observations, not one odd-looking suspect, but stay fair and solvable in ten seconds. Keep every clue causally sound: the action must create the trace on the surface and in the place shown; a similar-looking mark alone is not proof. Use very simple, beginner-friendly English: short sentences and common everyday words only. Keep the mysteries cozy and funny: missing cakes, lost trophies, pranks, escaped pets, small lies. Vary the settings, crimes, and clue types across the episode. Never copy or lightly rework a past case or the reference transcript.</textarea></label>
        <p class="home-assurance">You choose every action. Results stay available after refresh.</p>
        <details class="advanced"><summary>Production profile</summary><div class="setting-grid">
          <label>TEXT MODEL<select id="text-model" required></select></label>
          <label>IMAGE MODEL<select id="image-model" required></select></label>
          <label>NARRATION MODEL<select id="narration-model" required></select></label>
          <label>SPEECH MODEL<select id="speech-model" required></select></label>
          <label>VOICE<select id="speech-voice"><option>cedar</option><option>marin</option><option>alloy</option><option>ash</option><option>ballad</option><option>coral</option><option>echo</option><option>fable</option><option>nova</option><option>onyx</option><option>sage</option><option>shimmer</option><option>verse</option></select></label>
          <label>VOICE SPEED<select id="speech-speed"><option value="0.85">0.85×</option><option value="0.90">0.90×</option><option value="0.95">0.95×</option><option value="1" selected>1.00×</option><option value="1.05">1.05×</option><option value="1.10">1.10×</option></select></label>
        </div><p class="privacy-note">Your API key stays in your local <code>.env</code>.</p></details>
        <button type="submit" class="primary wide">Create episode</button>
    </form>
  </main>
  <div id="notice" role="status" aria-live="polite" hidden></div>
</body>
</html>
